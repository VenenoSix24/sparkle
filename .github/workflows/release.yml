name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example v1.27.0'
        required: true
        type: string
      tag:
        description: 'Target release tag, defaults to the version'
        required: false
        type: string
  # fork：注释掉上游每月末自动发版的定时任务，仅保留手动与 tag 触发
  # schedule:
  #   # 12:00 in Asia/Hong_Kong; prepare filters out non-month-end dates.
  #   - cron: '0 4 28-31 * *'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Determine Release Version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            CURRENT_DAY=$(TZ=Asia/Hong_Kong date +%d)
            CURRENT_MONTH=$(TZ=Asia/Hong_Kong date +%m)
            TOMORROW_MONTH=$(TZ=Asia/Hong_Kong date -d tomorrow +%m)
            if [[ "$CURRENT_MONTH" == "$TOMORROW_MONTH" && "$CURRENT_DAY" != "01" ]]; then
              echo "Not the last day of the month or a delayed month-end run in Asia/Hong_Kong"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          case "$EVENT_NAME" in
            schedule)
              PACKAGE_VERSION=$(jq -r '.version' package.json)
              if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Invalid package version: $PACKAGE_VERSION"
                exit 1
              fi

              if git rev-parse -q --verify "refs/tags/$PACKAGE_VERSION^{commit}" >/dev/null; then
                BASE_TAG=$PACKAGE_VERSION
              elif git rev-parse -q --verify "refs/tags/v$PACKAGE_VERSION^{commit}" >/dev/null; then
                BASE_TAG="v$PACKAGE_VERSION"
              else
                echo "Cannot find stable tag for package version $PACKAGE_VERSION"
                exit 1
              fi

              CHANGES=$(git log "$BASE_TAG..HEAD" --pretty=format:%s | grep -Ev '^update version to [0-9]+\.[0-9]+\.[0-9]+$' || true)
              if [[ -z "$CHANGES" ]]; then
                echo "No new commits since stable tag $BASE_TAG"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              IFS=. read -r MAJOR MINOR PATCH <<< "$PACKAGE_VERSION"
              RAW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
            workflow_dispatch)
              RAW_VERSION="$INPUT_VERSION"
              ;;
            push)
              RAW_VERSION="$REF_NAME"
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME"
              exit 1
              ;;
          esac

          VERSION=${RAW_VERSION#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RAW_VERSION"
            exit 1
          fi

          TARGET_TAG=$VERSION
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TARGET_TAG=${INPUT_TAG#v}
            if [[ "$TARGET_TAG" != "$VERSION" ]]; then
              echo "Release tag must equal the version (tag=$INPUT_TAG, version=$VERSION)"
              exit 1
            fi
          fi
          git check-ref-format "refs/tags/$TARGET_TAG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.should_release == 'true'
    needs: [prepare]
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  update-version:
    if: needs.prepare.outputs.should_release == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.update.outputs.commit_sha }}
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update Version
        id: update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > tmp.json && mv tmp.json package.json
          if git diff --quiet -- package.json; then
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json
          git commit -m "update version to $RELEASE_VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    if: needs.prepare.outputs.should_release == 'true'
    needs: [prepare, build, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Generate Changelog
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 已停用：自用段改由 changelog/fork-notes 提供，不再调用翻译接口
          # API_URL: ${{ secrets.API_URL }}
          # API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          # 自用修改版：日志 = changelog/fork-notes/<版本>.md + 上游同名版本官方日志
          git remote add upstream https://github.com/xishang0128/sparkle.git
          git fetch upstream master --no-tags 2>/dev/null || true
          # 取到自建命名空间，避免解析到本仓库的同名 tag
          git fetch upstream "refs/tags/$RELEASE_VERSION:refs/upstream-tags/$RELEASE_VERSION" --no-tags 2>/dev/null || true
          UPSTREAM_SHA=$(git rev-parse -q --verify "refs/upstream-tags/$RELEASE_VERSION" || true)

          # 已停用：按提交标题自动生成自用段（区间误用上游 tag，未配翻译 secrets 时还会输出英文原文）
          # if [[ -n "$UPSTREAM_SHA" ]]; then
          #   FORK_COMMITS=$(
          #     while IFS= read -r sha; do
          #       if git merge-base --is-ancestor "$sha" refs/remotes/upstream/master 2>/dev/null; then
          #         continue
          #       fi
          #       git log -1 --pretty=%s "$sha"
          #     done < <(git log --no-merges "$UPSTREAM_SHA..HEAD" --pretty=format:%H) |
          #       grep -Ev '^update version to [0-9]+\.[0-9]+\.[0-9]+$' || true
          #   )
          # else
          #   PREVIOUS_TAG=$(
          #     git tag --merged HEAD |
          #       awk -v current="$RELEASE_VERSION" '
          #         {
          #           normalized = $0
          #           sub(/^v/, "", normalized)
          #           if (normalized ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ && normalized != current) {
          #             print normalized "\t" $0
          #           }
          #         }
          #       ' |
          #       sort -t $'\t' -k1,1V |
          #       tail -n 1 |
          #       cut -f 2-
          #   )
          #   if [[ -n "$PREVIOUS_TAG" ]]; then
          #     FORK_COMMITS=$(git log --no-merges "$PREVIOUS_TAG..HEAD" --pretty=format:%s | grep -Ev '^update version to [0-9]+\.[0-9]+\.[0-9]+$' || true)
          #   else
          #     FORK_COMMITS=$(git log --no-merges HEAD --pretty=format:%s | grep -Ev '^update version to [0-9]+\.[0-9]+\.[0-9]+$' || true)
          #   fi
          # fi

          # 上游 release 正文（截掉指向上游的下载地址一节）
          UPSTREAM_BODY=""
          if [[ -n "$UPSTREAM_SHA" ]]; then
            UPSTREAM_BODY=$(gh api "repos/xishang0128/sparkle/releases/tags/$RELEASE_VERSION" --jq '.body' 2>/dev/null | sed '/### 下载地址/,$d' || true)
          fi

          # 自用段取自 changelog/fork-notes/<版本>.md，文件不存在时只写「同步上游」
          FORK_NOTES_FILE="changelog/fork-notes/$RELEASE_VERSION.md"
          echo '# 更新日志' > changelog.md
          printf '\n## 自用修改版更新内容\n\n' >> changelog.md
          if [[ -f "$FORK_NOTES_FILE" ]]; then
            cat "$FORK_NOTES_FILE" >> changelog.md
          else
            echo "- 同步上游 Sparkle $RELEASE_VERSION" >> changelog.md
          fi

          if [[ -n "$UPSTREAM_BODY" ]]; then
            {
              echo ''
              echo "## 上游 $RELEASE_VERSION 更新内容"
              echo ''
              printf '%s\n' "$UPSTREAM_BODY"
            } >> changelog.md
          fi

          # 已停用：两者皆为空时兜底取最后一条提交标题
          # if ! grep -q '^## ' changelog.md; then
          #   LAST_COMMIT=$(git log -1 --pretty=format:%s)
          #   echo '## 更新内容' >> changelog.md
          #   echo '' >> changelog.md
          #   echo ' - '"$LAST_COMMIT" >> changelog.md
          # fi

      - name: Set Release Version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Install Dependencies and Generate Metadata
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          npm install -g pnpm
          SKIP_PREPARE=1 pnpm install
          pnpm updater

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: bin/
          merge-multiple: true

      - name: Delete Current Release Assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare.outputs.tag }}
          deleteOnlyFromDrafts: false

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.update-version.outputs.commit_sha }}
          body_path: changelog.md
          files: |
            latest.yml
            bin/dist/*
          make_latest: true

      - name: Verify Published Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq '.html_url'
          MANIFEST_TAG=$(gh release download "$RELEASE_TAG" -p latest.yml -O - | sed -n 's/^tag: *//p' | head -1)
          if [[ "$MANIFEST_TAG" != "$RELEASE_TAG" ]]; then
            echo "latest.yml tag '$MANIFEST_TAG' does not match release tag '$RELEASE_TAG'" >&2
            exit 1
          fi
